[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev_accel"
version = "0.1.0"
description = "Rule + Jev decision gates for agents driving a TI F280049C LaunchPad and a RIGOL MSO5104"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk==0.7.2", "mcp==2.3.0", "numpy>=2", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-accel = "jev_accel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "jev: calls the TypeSafe Jev API (needs TYPESAFE_API_KEY)",
    "hw: needs the RIGOL MSO5104 reachable on the LAN",
]
